services:
  db:
    image: timescale/timescaledb:latest-pg15
    container_name: tradescope_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tradescope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tradescope}
      POSTGRES_DB: ${POSTGRES_DB:-tradescope}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradescope"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tradescope_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      target: dev
    container_name: tradescope_api
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./backend
      target: dev
    container_name: tradescope_worker
    env_file: .env
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.core.celery_app:celery_app worker --loglevel=info

  beat:
    build:
      context: ./backend
      target: dev
    container_name: tradescope_beat
    env_file: .env
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.core.celery_app:celery_app beat --loglevel=info

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: tradescope_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    command: npm run dev

volumes:
  pgdata:
